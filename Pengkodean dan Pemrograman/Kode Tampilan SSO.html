<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login SSO UNDIP - Olive Theme</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #e9f0e1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: #fdfdfb;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 80px;
      margin-bottom: 20px;
    }

    h2 {
      color: #3e4d2c;
      margin-bottom: 5px;
    }

    p {
      color: #607240;
      margin-bottom: 25px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid #b8c79a;
      border-radius: 8px;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #8da46f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:hover {
      background-color: #7d945e;
    }

    .reset-btn {
      margin-top: 15px;
      background-color: #d9534f;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .reset-btn:hover {
      background-color: #c9302c;
    }

    .register {
      margin-top: 15px;
      color: #5a6e3b;
    }

    .register a {
      color: #4b8f29;
      text-decoration: none;
      font-weight: bold;
    }

    .register a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/id/8/84/Lambang_Universitas_Diponegoro.png" alt="UNDIP Logo">
    <h2>Single Sign On (SSO)</h2>
    <p>Universitas Diponegoro</p>

    <input type="text" placeholder="NIM/NIP/username/e-mail official Undip">
    <button class="login-btn">LOGIN</button>
    <button class="reset-btn">Reset Password</button>

    <div class="register">
      Belum memiliki akun? <a href="#">Daftar sekarang!</a>
    </div>

    <footer>
      © 2025 DSTI Universitas Diponegoro. All rights reserved.
    </footer>
  </div>

</body>
</html>
